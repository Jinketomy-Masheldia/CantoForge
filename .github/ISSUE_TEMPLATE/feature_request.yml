{
  "name": "Feature request",
  "description": "Suggest an improvement to the unofficial iPadOS port.",
  "body": [
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "Problem or workflow",
        "description": "Describe the task you are trying to complete on iPad."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "proposal",
      "attributes": {
        "label": "Suggested improvement",
        "description": "Explain how it would help while preserving the desktop Studio workflow."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "context",
      "attributes": {
        "label": "Additional context",
        "description": "Include an example, device/input details or an existing workaround, if useful."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
