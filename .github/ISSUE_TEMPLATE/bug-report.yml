{
  "name": "Bug report",
  "description": "Report an issue with the unofficial iPadOS port.",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Report port-specific problems here. Please remove private filenames, score content and device details from attachments before posting."
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "Port version and iPad bundle revision",
        "description": "Use the release/tag and bundle revision from the diagnostic log, or include your source commit."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "device",
      "attributes": {
        "label": "iPad model",
        "placeholder": "iPad Pro 11-inch (2022, M2)"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "os",
      "attributes": {
        "label": "iPadOS version",
        "placeholder": "Include the full version shown in Settings."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "input",
      "attributes": {
        "label": "Input method",
        "options": [
          "Finger touch",
          "Apple Pencil",
          "Mouse or trackpad",
          "External keyboard",
          "Mixed or other input"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "steps",
      "attributes": {
        "label": "Steps to reproduce",
        "placeholder": "1. Open ...\n2. Tap ...\n3. ..."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "result",
      "attributes": {
        "label": "Expected and actual behavior"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "attachments",
      "attributes": {
        "label": "Logs, crash report and supporting files",
        "description": "Attach the relevant application log and matching .ips report for a crash, if available. A minimal score ZIP or short recording can help. Share only files you have permission to disclose."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "regression",
      "attributes": {
        "label": "Additional context",
        "description": "Did an earlier port build work? Does official desktop Studio show the same problem? Mention any storage provider or accessory involved."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
